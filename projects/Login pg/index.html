<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="toggle">
        <div class="login">
            <div class="box">
                <div class="box1 login-text">
                    <h1>WELCOME <br>BACK!</h1>
                    <p>Sign in to stay connected and manage your workspace securely.</p>
                </div>
                <div class="box1 signup-text">
                    <h1>HELLO<br>FRIEND!</h1>
                    <p>Enter your personal details and start journey with us.</p>
                </div>  
            </div>
            
            <div class="forms">
                
                <form class="box2 form" id="loginForm">
                    <h2>Login</h2>
                    <input type="text" id="loginUser" required placeholder="Username"> <br>
                    <input type="password" id="loginPass" required placeholder="Password"> <br>
                    <button type="submit" id="loginBtn">Login</button> <br>
                    <label for="toggle">Don't have an account? <span>Sign Up</span></label>
                </form>  
                
                
                <form class="box2 signup" id="signupForm">
                    <h2>Register</h2>
                    <input type="text" id="signupUser" required placeholder="Username">
                    <input type="email" id="signupEmail" required placeholder="Email">
                    <input type="password" id="signupPass" required placeholder="Password">
                    <button type="submit" id="signupBtn">Register</button>
                    <label for="toggle">Already have an account? <span>Sign In</span></label>
                </form>  
            </div>   
        </div> 
    </div>
    <script src="script.js"></script>
</body>
</html>
